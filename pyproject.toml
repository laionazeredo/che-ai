[project]
name = "che-ai"
version = "1.0.0"
description = "IDE-agnostic Agentic Engineering Harness"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
che-ai = "che_core.cli:main"
che = "che_core.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["che_core"]

[tool.ruff]
line-length = 120
target-version = "py39"
include = ["che_core/**/*.py", "hooks/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"] # Ignore line length violations (handled by formatter)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
