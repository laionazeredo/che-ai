# Expose the Paperclip browser UI (override for docker-compose.yml).
#
# You normally do not run this directly: `./bootstrap.sh` imports the Che org
# first and then switches to this override. Use it on its own only when the
# import was already done and you just want the authenticated UI back up.
#
#   docker compose -f docker-compose.yml -f docker-compose.ui.yml up -d
#
# Two env vars are REQUIRED in `authenticated` mode and are easy to miss:
#   - BETTER_AUTH_SECRET          : mandatory (not in local_trusted)
#   - BETTER_AUTH_TRUSTED_ORIGINS : the derived origins use the *container* port
#     (3100), so the browser origin must be listed explicitly or every request
#     fails with "Invalid origin".
services:
  paperclip:
    environment:
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_BIND: lan
      HOST: 0.0.0.0
      PAPERCLIP_INSTANCE_ID: default
      PAPERCLIP_PUBLIC_URL: "http://localhost:${CHE_UI_PORT:-3210}"
      PAPERCLIP_AUTH_PUBLIC_BASE_URL: "http://localhost:${CHE_UI_PORT:-3210}"
      PAPERCLIP_ALLOWED_HOSTNAMES: "localhost,127.0.0.1"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-paperclip-local-dev-secret-change-me}"
      BETTER_AUTH_TRUSTED_ORIGINS: "http://localhost:${CHE_UI_PORT:-3210},http://127.0.0.1:${CHE_UI_PORT:-3210}"
    ports:
      - "${CHE_UI_PORT:-3210}:3100"
