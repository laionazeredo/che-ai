name: harness-smoke

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node + corepack (pnpm 9)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@9 --activate

      - name: pnpm install (tsx + typescript + @types/node)
        run: pnpm install --prefer-offline --frozen-lockfile

      - name: structure counts (22 commands / 3 hooks / ≥2 contracts / scripts exists)
        run: |
          set -euo pipefail
          test "$(ls -1 commands | wc -l)" = "22"
          test "$(ls -1 hooks    | wc -l)" = "3"
          test "$(ls -1 contracts | wc -l)" -ge 2
          test -f contracts/harness_sessions_contract.sh
          test -f contracts/decisions-query.cli.ts
          test -f scripts/install-harness.sh
          test -x scripts/install-harness.sh
          test -f README.md
          test -f HARNESS_RULES.md
          test -f HARNESS_COMMANDS.md
          test -f REFERENCE_USER_RULES_MINIFIED.md
          test -f hooks.json
          test -f package.json
          test -f tsconfig.json

      - name: typecheck strict (tsc --noEmit)
        run: pnpm typecheck

      - name: decisions CLI smoke (4 modos help+run)
        run: |
          set -euo pipefail
          JSONL=$(mktemp)
          cat > "$JSONL" <<'EOF'
          {"_v":1,"event":"SPEC_APPROVED","ts":"2026-08-30T19:23:15Z","spec_id":"SPEC-X","data":{"approver":"user"}}
          {"_v":1,"event":"SHIP_DONE","ts":"2026-08-30T19:30:00Z","spec_id":"SPEC-X","data":{"pr":"#12"}}
          EOF
          pnpm decisions "$JSONL" summary --lang pt
          pnpm decisions "$JSONL" filter --spec SPEC-X --last 1
          pnpm decisions "$JSONL" tail --last 1
          pnpm decisions "$JSONL" export --format csv --out /tmp/d.csv
          test -s /tmp/d.csv
          rm -f "$JSONL" /tmp/d.csv

      - name: install-script dry-run (idempotent, no errors)
        run: |
          set -euo pipefail
          T=$(mktemp -d)
          bash scripts/install-harness.sh --source "$PWD" --target "$T"
          rm -rf "$T"
